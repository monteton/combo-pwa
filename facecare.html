<!DOCTYPE html>
<html lang="ru">
<head>
  <script src="access-control.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#7a4bd1" />
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
  <title>Уход за лицом</title>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="icon-btn" href="main.html" aria-label="Назад" data-icon="back"></a>
      <h1>Уход за лицом</h1>
    </header>

    <div class="intro-card intro-violet">
      <h2>Видео-уроки</h2>
      <p>Нажмите на урок, чтобы открыть видео.</p>
    </div>

    <div class="face-list" id="face-first"></div>

    <a class="wide-link" href="useful-links.html" style="margin:14px 0">
      <div class="chip-ico ico-green" data-icon="link"></div>
      <div class="wl-text"><b>Полезные ссылки</b><span>В этом разделе вы найдете все актуальные ссылки на косметические средства</span></div>
      <div class="arrow arrow-green" data-icon="arrow"></div>
    </a>

    <div class="face-list" id="face-second"></div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    document.querySelectorAll('[data-icon]').forEach(el => el.innerHTML = ICONS[el.dataset.icon]);
    renderTabbar('');

    // Первые уроки и бонусное видео — до блока «Полезные ссылки», уроки по массажерам и аппаратам — после
    const SPLIT = FACE_VIDEOS.findIndex(v => v.bonus) + 1;
    let n = 0;
    const item = (v, i) => {
      if (!v.bonus) n++;
      return `<button class="face-item${v.bonus ? ' bonus' : ''}" data-face="${i}">
        <div class="w-num ico-violet">${v.bonus ? '🎁' : n}</div>
        <div><b>${v.title}</b><span>${v.bonus ? 'Бонусное видео' : 'Видео ' + n}</span></div>
      </button>`;
    };
    document.getElementById('face-first').innerHTML = FACE_VIDEOS.slice(0, SPLIT).map((v, i) => item(v, i)).join('');
    document.getElementById('face-second').innerHTML = FACE_VIDEOS.slice(SPLIT).map((v, i) => item(v, i + SPLIT)).join('');
    document.querySelectorAll('[data-face]').forEach(b => {
      const v = FACE_VIDEOS[b.dataset.face];
      b.onclick = () => openVideo(v.src, v.title);
    });
  </script>
</body>
</html>
